# Runs only when a semver tag is pushed (make bump-patch-push). Tests on
# Linux, then cross-compiles every target (linux, darwin, windows on amd64
# and arm64) and publishes a GitHub release named after the tag.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make deps-check
      - run: make lint
      - run: make test-race

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the tag is what git describe sees
        run: |
          set -e
          make check-version
          desc=$(git describe --tags --exact-match)
          [ "$desc" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != git describe $desc"; exit 1; }
      - run: make release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $pre dist/*.tar.gz dist/*.zip dist/SHA256SUMS
