# Runs only when a semver tag is pushed (make bump-patch-push). Tests on all
# three operating systems, then cross-compiles every target on Linux and
# publishes a GitHub release named after the tag.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check, lint and test
        if: runner.os != 'Windows'
        run: |
          set -e
          make deps-check
          make lint
          make test-race
      # The Windows runner has no POSIX sh for make and no C toolchain
      # guarantee for -race; run the same steps directly.
      - name: Check, lint and test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          go mod verify
          go vet ./...
          test -z "$(gofmt -l .)"
          go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the tag is what git describe sees
        run: |
          set -e
          make check-version
          desc=$(git describe --tags --exact-match)
          [ "$desc" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != git describe $desc"; exit 1; }
      - run: make release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $pre dist/*.tar.gz dist/*.zip dist/SHA256SUMS
